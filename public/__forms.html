<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Brown &amp; Gaines form definitions</title>
  </head>
  <body>
    <form name="general-inquiry" method="POST" data-netlify="true" netlify-honeypot="website">
      <input name="requestId" />
      <input name="source" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="business" />
      <input name="interest" />
      <textarea name="message"></textarea>
      <input name="website" />
    </form>

    <form name="business-intake" method="POST" data-netlify="true" netlify-honeypot="website">
      <input name="requestId" />
      <input name="source" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="business" />
      <input name="interest" />
      <textarea name="message"></textarea>
      <input name="stage" />
      <textarea name="outcome"></textarea>
      <input name="priority" />
      <input name="timing" />
      <input name="budget" />
      <input name="website" />
    </form>
  </body>
</html>
